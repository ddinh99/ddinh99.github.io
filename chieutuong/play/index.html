<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chieu Tuong">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chieu Tuong</title>
  <link rel="manifest" href="manifest.json">

  <!--
    iOS Safari's default behavior is to scroll the whole page to keep a
    focused <input> visible whenever the on-screen keyboard opens. Flutter
    web's canvas is a single full-height element covering <body>, so that
    native scroll drags the entire app UI upward instead of just avoiding
    the keyboard the way resizeToAvoidBottomInset expects. Locking html/body
    to position: fixed removes anything for Safari to scroll.
  -->
  <style>
    html, body {
      position: fixed;
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /*
      Loading overlay: painted straight from HTML/CSS so it appears the
      instant the page's markup parses, well before the (potentially large,
      slow-to-fetch-on-some-devices) Flutter engine and app JS finish
      downloading and boot. Removed once the engine reports its first frame.
    */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #2e0a0a;
      transition: opacity 0.4s ease-out;
    }

    #loading-overlay.loading-overlay-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay img {
      width: 96px;
      height: 96px;
      border-radius: 20%;
    }

    #loading-overlay .loading-bar-track {
      width: 180px;
      height: 4px;
      border-radius: 2px;
      background: rgba(176, 44, 40, 0.25);
      overflow: hidden;
    }

    #loading-overlay .loading-bar-fill {
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #b02c28;
      animation: loading-bar-slide 1.1s ease-in-out infinite;
    }

    @keyframes loading-bar-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <img src="icons/Icon-192.png" alt="">
    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Belt-and-suspenders: if Safari still shifts the visual viewport when
    // the keyboard opens/closes (e.g. via visualViewport.offsetTop), snap
    // the document scroll position back so Flutter's own layout stays the
    // source of truth for keyboard avoidance.
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        window.scrollTo(0, 0);
      });
      window.visualViewport.addEventListener('scroll', function () {
        window.scrollTo(0, 0);
      });
    }

    // Hide the loading overlay once Flutter has actually painted its first
    // frame (not just once the JS/wasm finished downloading — the app still
    // needs to boot and lay out the first screen after that).
    window.addEventListener('flutter-first-frame', function () {
      var overlay = document.getElementById('loading-overlay');
      if (!overlay) return;
      overlay.addEventListener('transitionend', function () {
        overlay.remove();
      });
      overlay.classList.add('loading-overlay-hidden');
    });
  </script>
</body>
</html>
